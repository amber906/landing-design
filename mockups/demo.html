<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device Mockup Demo</title>
<style>
  body{margin:0;background:#F7F8FA;color:#1A1C20;font-family:"Pretendard","Inter",-apple-system,system-ui,sans-serif;
    display:flex;gap:64px;flex-wrap:wrap;align-items:flex-start;justify-content:center;padding:64px 24px;}
  figure{margin:0;}
  h3{text-align:center;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#8A94A3;margin:0 0 20px;}
  /* --- Source A : Litmers device frames --- */
  .mk-laptop{position:relative;width:640px;max-width:88vw;aspect-ratio:3880/2300;}
  .mk-laptop .mk-frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .mk-laptop .mk-screen{position:absolute;top:8.7%;right:12.94%;bottom:13.04%;left:12.84%;overflow:hidden;background:#fff;border-radius:4px;}
  .mk-laptop .mk-screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;}
  .mk-phone{position:relative;width:260px;max-width:60vw;aspect-ratio:402/874;}
  .mk-phone .mk-screen{position:absolute;inset:0;border-radius:11% / 5%;overflow:hidden;background:#fff;}
  .mk-phone .mk-screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;}
  .mk-phone .mk-frame{position:absolute;top:-2.6%;left:-6%;width:112%;height:105%;pointer-events:none;}
</style></head>
<body>
  <div>
    <h3>Laptop (web)</h3>
    <figure class="mk mk-laptop">
      <div class="mk-screen"><img src="sample-web.png" alt="웹 화면"></div>
      <img class="mk-frame" src="assets/macbook-air.png" alt="" aria-hidden="true">
    </figure>
  </div>
  <div>
    <h3>Phone (app)</h3>
    <figure class="mk mk-phone">
      <div class="mk-screen"><img src="sample-app.png" alt="앱 화면"></div>
      <img class="mk-frame" src="assets/iphone16pro-black.png" alt="" aria-hidden="true">
    </figure>
  </div>
</body></html>
